/*
 * Self-contained demo host for the Meerkat demo dashboard.
 *
 * The default conf.d objects (templates, localhost host, etc.) are archived at
 * container start, so this host is intentionally self-contained (no template
 * imports) and is preserved through that archiving by /opt/run. It gives Meerkat
 * something live to display regardless of whether any NetBox-synced hosts exist.
 */

object Host "meerkat-demo" {
  display_name = "Meerkat Demo Host"
  check_command = "hostalive"
  address = "127.0.0.1"
  check_interval = 1m
  retry_interval = 30s
  vars.os = "Docker"
}

object Service "Ping" {
  host_name = "meerkat-demo"
  check_command = "ping4"
  check_interval = 1m
  retry_interval = 30s
}

object Service "Load" {
  host_name = "meerkat-demo"
  check_command = "load"
  check_interval = 1m
  retry_interval = 30s
}

object Service "Processes" {
  host_name = "meerkat-demo"
  check_command = "procs"
  check_interval = 1m
  retry_interval = 30s
}
