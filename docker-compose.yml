services:
  icinga2:
    # Build the image locally so you get the pinned/refreshed versions
    # (Icinga2, IcingaDB, Director, the sol1 NetBox module, Meerkat, ...).
    # To use the prebuilt image instead, comment out `build:` and uncomment `image:`.
    build:
      context: ./
      dockerfile: Dockerfile
      # Proxy build args (empty unless start-with-netbox.sh --proxy is used).
      # Docker treats these predefined names as proxy env for RUN steps
      # (apt/curl/wget) without needing ARG declarations in the Dockerfile.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    #image: sol1/icinga2-stack
    restart: on-failure:5
    # Set your hostname to the FQDN under which your
    # satellites will reach this container
    hostname: icinga2
    env_file:
      - secrets_sql.env
    environment:
      - ICINGA2_FEATURE_GRAPHITE=0
      # Important:
      # keep the hostname graphite the same as
      # the name of the graphite docker-container
      - ICINGA2_FEATURE_GRAPHITE_HOST=graphite
      - ICINGA2_FEATURE_GRAPHITE_PORT=2003
      - ICINGA2_FEATURE_GRAPHITE_URL=http://graphite
      # NETBOX_URL / NETBOX_APIKEY are written into secrets_sql.env by
      # start-with-netbox.sh (or supply your own for an external NetBox).
      # - ICINGA2_FEATURE_GRAPHITE_SEND_THRESHOLDS=true
      # - ICINGA2_FEATURE_GRAPHITE_SEND_METADATA=false
      - ICINGAWEB2_ADMIN_USER=icingaadmin
      - ICINGAWEB2_ADMIN_PASS=icinga
      #- ICINGA2_USER_FULLNAME=Icinga2 Docker Monitoring Instance
      - DEFAULT_MYSQL_HOST=localhost
      # Sending notification e-mail is OPTIONAL and configured via secrets_sql.env:
      #   NOTIFICATION_FROM_ADDRESS - sender address (e.g. your Gmail address)
      #   GMAIL_SMTP_PASSWORD       - Gmail app password (leave empty to disable mail)
      # See https://support.google.com/accounts/answer/185833 for app passwords.
    volumes:
      - ./data/icinga/cache:/var/cache/icinga2
      - ./data/icinga/certs:/etc/apache2/ssl
      - ./data/icinga/etc/icinga2:/etc/icinga2
      - ./data/icinga/etc/icingaweb2:/etc/icingaweb2
      - ./data/icinga/etc/icingadb:/etc/icingadb
      - ./data/icinga/lib/icinga:/var/lib/icinga2
      - ./data/icinga/lib/php/sessions:/var/lib/php/sessions
      - ./data/icinga/log/apache2:/var/log/apache2
      - ./data/icinga/log/icinga2:/var/log/icinga2
      - ./data/icinga/log/icingaweb2:/var/log/icingaweb2
      - ./data/icinga/log/mysql:/var/log/mysql
      - ./data/icinga/spool:/var/spool/icinga2
      - ./data/icinga/cron.d/icinga:/etc/cron.d/icinga
      - ./data/icinga/lib/mysql:/var/lib/mysql
    ports:
      - "${ICINGA_PORT:-8080}:80"
      - "5665:5665"
      - "${MEERKAT_PORT:-8888}:8888"
